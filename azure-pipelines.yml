trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: Bash@3
    displayName: "Request OIDC token"
    inputs:
      targetType: inline
      script: |
        # Request an OIDC token from Azure DevOps
        OIDC_RESPONSE=$(curl -s -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
          "$SYSTEM_OIDCREQUESTURI&audience=api://AzureADTokenExchange")

        OIDC_TOKEN=$(echo $OIDC_RESPONSE | jq -r '.value')

        echo "OIDC_TOKEN=$OIDC_TOKEN" >> $BASH_ENV

  - task: Bash@3
    displayName: "Show OIDC Token Claims"
    inputs:
      targetType: inline
      script: |
        echo "Truncated OIDC token: ${OIDC_TOKEN:0:50}..."

        PAYLOAD=$(echo $OIDC_TOKEN | cut -d "." -f2 | base64 -d 2>/dev/null | jq)
        echo "Decoded claims:"
        echo "$PAYLOAD"


